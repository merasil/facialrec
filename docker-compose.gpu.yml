services:
  facialrec:
    image: facialrec:gpu
    build:
      target: standard
      args:
        TENSORFLOW_IMAGE: tensorflow/tensorflow:2.21.0-gpu
        CUDNN_PACKAGE: libcudnn9-cuda-12=9.3.0.75-1
    command: ["python3", "test.py", "--base", "--gpu", "--start"]
    environment:
      FACIALREC_REQUIRE_GPU: "1"
      FACIALREC_TF_GPU_MEMORY_LIMIT_MB: "2048"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CUDA_CACHE_PATH: /var/cache/nvidia/ComputeCache
      CUDA_CACHE_MAXSIZE: "2147483648"
    volumes:
      - ./cuda-cache:/var/cache/nvidia/ComputeCache
    # Use CDI devices instead of `gpus: all` to avoid the legacy NVIDIA hook.
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids:
                - "nvidia.com/gpu=all"
              capabilities: ["gpu"]
