[basic]
stream_url = rtsp://MyCam
push_url = http://MyServer/ExampleState
motion_url = None
debug = False

[face_recognition]
detector_model = retinaface
recognition_model = Facenet512
metric = euclidean
# Face Alignment
alignment = False
# Face Detection Enforcement
enforce = True

[database]
path = db

[thresholds]
# No. of Recognitions before opening the Door
clearance = 3
# No. of Seconds before Clearence-Counter gets reseted
last_seen = 7
# Distance Threshold for ByPassing Clearance-Counter
pretty_sure = 0.7

[performance]
# Enable parallel frame processing (True/False)
parallel_processing = False
# Number of parallel workers for frame processing
max_workers = 2
# Number of frames to process per motion event
frames_per_motion = 1
