[basic]
# Container startup runs `python3 test.py --base` against this configuration
# before main.py starts.
# Main stream URL for face recognition (recommended: 2048x1536 or 2304x1296)
stream_url = rtsp://MyCam
# Optional: separate low-resolution stream for motion detection (e.g. 640x360 or 640x480)
# Leave empty to use main stream for both motion and face recognition
stream_url_lowres = rtsp://MyCam/subStream
push_url = http://MyServer/ExampleState
# External motion detection URL (only used when motion.use_internal = False)
motion_url = http://MyServer/ExampleMotionState
# Verbose logging level (0-4):
# 0 = No extra logging
# 1 = Log door openings only
# 2 = Level 1 + detected faces count + recognized identities
# 3 = Level 2 + motion detection start/stop
# 4 = Level 3 + performance timing information
verbose = 1

[face_recognition]
detector_model = retinaface
recognition_model = Facenet512
metric = euclidean
# Face Alignment
alignment = False
# Face Detection Enforcement
enforce = True

[database]
path = db

[thresholds]
# No. of Recognitions before opening the Door
clearance = 3
# No. of Seconds before Clearence-Counter gets reseted
last_seen = 7
# Distance Threshold for ByPassing Clearance-Counter
pretty_sure = 0.7
# Cooldown in seconds before openDoor can be triggered again for the same person
open_door_cooldown = 30

[motion]
# Use internal motion detection instead of external API (True/False)
use_internal = False
# Divide motion frame width and height by this integer (>= 1); default: no resize.
# Example: 640x360 with factor 2 becomes 320x180, preserving the aspect ratio.
# Output dimensions are rounded down and must each be at least 32 pixels.
# Blur and dilation scale with the factor. Only internal motion detection is affected.
resize_factor = 1
# Pixel difference threshold for motion detection (0-255, lower = more sensitive)
threshold = 25
# Minimum area as percentage of frame to consider as motion (0.0-100.0)
# Examples: 0.1 = very sensitive, 0.2 = medium, 0.5 = low sensitivity
min_area_percent = 0.2
# Seconds to keep motion active after last detection (prevents missing slow-moving people)
cooldown_seconds = 5
# Background adaptation rate for motion reference (0.0-1.0)
# Lower = slower adaptation, better at catching slow motion (but more sensitive to lighting changes)
# Higher = faster adaptation, only catches quick motion
background_alpha = 0.05
