services:
  facialrec:
    build: .
    environment:
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp
    volumes:
      - ./config:/app/config
      - ./db:/app/db
      - ./output:/app/output
      - ./weights:/root/.deepface/weights
    # Direct CDI assignment is inherited by `docker compose run`.
    devices:
      - "nvidia.com/gpu=all"
    restart: unless-stopped
