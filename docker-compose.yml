services:
  facialrec:
    image: facialrec:cpu
    pull_policy: never
    build:
      context: .
      target: standard
      args:
        TENSORFLOW_IMAGE: tensorflow/tensorflow:2.21.0
    init: true
    environment:
      OPENCV_FFMPEG_CAPTURE_OPTIONS: rtsp_transport;tcp
      FACIALREC_REQUIRE_GPU: "0"
    volumes:
      - ./config:/app/config
      - ./db:/app/db
      - ./weights:/root/.deepface/weights
    restart: unless-stopped
